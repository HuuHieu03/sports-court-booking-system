services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sports-court-booking-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - API_PREFIX=api/v1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=sports_court_booking_dev
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sports_court_booking_dev?schema=public
      - JWT_SECRET=compose_local_dev_secret_key_change_me
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: sports-court-booking-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sports_court_booking_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sports_court_booking_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
