server {
    listen 80;
    server_name _;

    # 1. Phục vụ tài nguyên tĩnh của Frontend React (Vite SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Hỗ trợ React Router: nếu không tìm thấy file thật, trả về index.html
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy: Chuyển hướng các request API sang container Backend NestJS
    location /api/v1/ {
        proxy_pass http://backend:3000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Chuyển hướng Swagger UI
    location /api/docs {
        proxy_pass http://backend:3000/api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
