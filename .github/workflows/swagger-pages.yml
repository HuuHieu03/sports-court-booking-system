name: Publish Swagger

on:
  push:
    branches: [main]
    paths:
      - documentation/api/openapi.yaml
      - documentation/api/swagger.html
      - .github/workflows/swagger-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish API documentation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Swagger site
        run: |
          mkdir _site
          cp documentation/api/swagger.html _site/index.html
          cp documentation/api/swagger.html _site/swagger.html
          cp documentation/api/openapi.yaml _site/openapi.yaml

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
