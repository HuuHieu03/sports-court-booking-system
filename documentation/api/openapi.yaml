          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/accounts/{accountId}/status:
    parameters:
      - name: accountId
        in: path
        required: true
        description: ID của tài nguyên.
        schema:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
    patch:
      tags:
        - Admin
      summary: Admin khóa hoặc mở khóa tài khoản
      description: |-
        **Ai được gọi:** Chỉ Admin đã đăng nhập.

        **Phạm vi:** Tài khoản có accountId trên đường dẫn, chưa bị xóa.

        LOCKED để khóa, ACTIVE để mở khóa. Khóa chặn đăng nhập và request cần xác thực, kể cả khi token còn hạn. Không tự thay đổi booking, quyền sở hữu hoặc bổ nhiệm. Không cho Admin tự khóa mình.
      operationId: patchAdminAccountsAccountidStatus
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Tài khoản đã xóa hoặc Admin đang tự khóa mình.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ACCOUNT_STATUS_CONFLICT
                message: Không thể thay đổi trạng thái tài khoản này.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountStatusRequest'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Mã lỗi ổn định để client xử lý.
        message:
          type: string
          description: Thông báo dễ đọc.
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - fullName
        - email
        - phone
        - password
        - role
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
          example: Nguyễn Minh Anh
        email:
          type: string
          format: email
          example: minhanh@example.com
        phone:
          type: string
          minLength: 1
          maxLength: 30
          example: 0901234567
          description: Server chuẩn hóa sang E.164 (vùng mặc định VN) trước khi lưu và kiểm tra trùng, ví dụ 0901234567
            lưu thành +84901234567. Không trùng với tài khoản khác, kể cả tài khoản đã xóa.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: Đề xuất tối thiểu 8 ký tự; không trả password trong response.
        role:
          type: string
          enum:
            - USER
            - OWNER
          description: Chọn khi đăng ký. Không thể tự đăng ký ADMIN hoặc tự nhận quyền Manager.
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: minhanh@example.com
        password:
          type: string
          format: password
          writeOnly: true
    AccountProfile:
      type: object
      description: Thông tin tài khoản dành cho chính người dùng, Admin hoặc Owner xem Manager đã bổ nhiệm. Owner
        và Manager xem profile khách đặt sân qua CustomerProfile trong các API booking của Venue.
      required:
        - id
        - fullName
        - email
        - phone
        - role
        - status
        - managedVenueIds
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        fullName:
          type: string
          example: Nguyễn Minh Anh
        email:
          type: string
          format: email
          example: minhanh@example.com
        phone:
          type: string
          example: '+84901234567'
        role:
          type: string
          enum:
            - USER
            - OWNER
            - ADMIN
          description: Vai trò tài khoản. Mọi tài khoản có quyền User; quyền Manager được gắn riêng theo từng Venue.
        status:
          type: string
          enum:
            - ACTIVE
            - LOCKED
            - DELETED
        createdAt:
          type: string
          format: date-time
          example: '2026-10-20T18:00:00+07:00'
        managedVenueIds:
          type: array
          uniqueItems: true
          description: Các Venue đang được bổ nhiệm quản lý. Một Manager có thể quản lý nhiều Venue; không có bổ
            nhiệm thì trả mảng rỗng.
          items:
            type: string
            format: uuid
    AuthResult:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - account
      properties:
        accessToken:
          type: string
          description: 'JWT dùng trong Authorization: Bearer <token>.'
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Thời hạn token, tính bằng giây.
          example: 3600
        account:
          $ref: '#/components/schemas/AccountProfile'
    Recruitment:
      type: object
      required:
        - isOpen
        - message
      properties:
        isOpen:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
          maxLength: 2000
          example: Tuyển quản lý sân ca chiều.
          description: Thông báo tuyển Manager hiển thị trên trang Venue.
    Venue:
      type: object
      description: Dữ liệu công khai của Venue. Không chứa profile hoặc thông tin liên hệ cá nhân của Owner/Manager.
      required:
        - id
        - name
        - address
        - description
        - managerRecruitment
      properties:
        id:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        name:
          type: string
          example: Sân bóng An Phú
        address:
          type: string
          example: 12 Đường số 5, TP. Hồ Chí Minh
        description:
          type: string
          nullable: true
          example: Cụm sân bóng đá phục vụ đặt sân theo giờ.
        managerRecruitment:
          $ref: '#/components/schemas/Recruitment'
    CreateVenueRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - address
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          nullable: true
          maxLength: 2000
    UpdateVenueRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          nullable: true
          maxLength: 2000
    Court:
      type: object
      required:
        - id
        - venueId
        - name
        - description
      properties:
        id:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        venueId:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        name:
          type: string
          example: Sân 1
        description:
          type: string
          nullable: true
          example: Sân cỏ nhân tạo.
    CreateCourtRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
    UpdateCourtRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
    Availability:
      type: object
      description: Chỉ phản ánh thời điểm kiểm tra; không giữ chỗ. Không trả booking hoặc thông tin người đặt khác.
      required:
        - courtId
        - startsAt
        - endsAt
        - available
      properties:
        courtId:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        startsAt:
          type: string
          format: date-time
          example: '2026-10-20T18:00:00+07:00'
        endsAt:
          type: string
          format: date-time
          example: '2026-10-20T19:00:00+07:00'
        available:
          type: boolean
          example: true
    CreateBookingRequest:
      type: object
      additionalProperties: false
      required:
        - courtId
        - startsAt
        - endsAt
      properties:
        courtId:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        startsAt:
          type: string
          format: date-time
          example: '2026-10-20T18:00:00+07:00'
        endsAt:
          type: string
          format: date-time
          example: '2026-10-20T19:00:00+07:00'
    Booking:
      type: object
      description: Thông tin booking. API quản lý Venue bổ sung profile người đặt qua BookingWithCustomerProfile.
      required:
        - id
        - venueId
        - courtId
        - userId
        - startsAt
        - endsAt
        - status
        - createdAt
        - cancelledAt
        - cancellationReason
      properties:
        id:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        venueId:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        courtId:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        userId:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        startsAt:
          type: string
          format: date-time
          example: '2026-10-20T18:00:00+07:00'
        endsAt:
          type: string
          format: date-time
          example: '2026-10-20T19:00:00+07:00'
        status:
          type: string
          enum:
            - CONFIRMED
            - CANCELLED
          description: Booking được xác nhận ngay khi tạo thành công.
        createdAt:
          type: string
          format: date-time
          example: '2026-10-18T09:00:00+07:00'
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancellationReason:
          type: string
          nullable: true
          description: Lý do khi Owner/Manager hủy booking của khách; null nếu chưa hủy hoặc User tự hủy.
          example: Sân cần sửa hệ thống chiếu sáng.
    CustomerProfile:
      type: object
      description: Profile người đã đặt sân, chỉ trả cho Owner sở hữu Venue hoặc Manager đang quản lý Venue chứa
        booking. Không cho phép xem profile khách chỉ bằng một userId tùy ý.
      required:
        - id
        - fullName
        - email
        - phone
      properties:
        id:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        fullName:
          type: string
          example: Nguyễn Minh Anh
        email:
          type: string
          format: email
          example: minhanh@example.com
        phone:
          type: string
          example: '+84901234567'
    BookingWithCustomerProfile:
      description: Booking kèm profile người đặt, dành riêng cho các API quản lý booking trong Venue.
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          required:
            - customerProfile
          properties:
            customerProfile:
              $ref: '#/components/schemas/CustomerProfile'
    UpdateRecruitmentRequest:
      type: object
      additionalProperties: false
      description: message bị bỏ qua trong request thì giữ nguyên; null nghĩa là xóa nội dung thông báo.
      required:
        - isOpen
      properties:
        isOpen:
          type: boolean
        message:
          type: string
          nullable: true
          maxLength: 2000
    ApplyManagerRequest:
      type: object
      additionalProperties: false
      description: 'Trước khi gửi, UI phải hiển thị: Khi ứng tuyển, bạn đồng ý chia sẻ email và số điện thoại đã
        đăng ký với Owner của Venue này.'
      required:
        - consentToShareContact
      properties:
        consentToShareContact:
          type: boolean
          enum:
            - true
          description: Phải là true sau khi User đồng ý. Không gửi false để tạo hồ sơ.
    ManagerApplication:
      type: object
      description: Biên nhận ứng tuyển. Thời điểm đồng ý được server ghi nhận, không lấy từ client.
      required:
        - id
        - venueId
        - applicantId
        - status
        - consentToShareContact
        - consentedAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        venueId:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        applicantId:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        status:
          type: string
          enum:
            - SUBMITTED
            - APPOINTED
            - REVOKED
          description: 'SUBMITTED: đã ứng tuyển; APPOINTED: đang được bổ nhiệm; REVOKED: Owner đã thu hồi bổ nhiệm.'
        consentToShareContact:
          type: boolean
          enum:
            - true
        consentedAt:
          type: string
          format: date-time
          example: '2026-10-20T18:00:00+07:00'
        createdAt:
          type: string
          format: date-time
          example: '2026-10-20T18:00:00+07:00'
    ApplicantContact:
      type: object
      description: Chỉ Owner của Venue có hồ sơ ứng tuyển đã đồng ý chia sẻ được đọc qua danh sách ứng viên.
      required:
        - id
        - fullName
        - email
        - phone
      properties:
        id:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        fullName:
          type: string
          example: Nguyễn Minh Anh
        email:
          type: string
          format: email
          example: minhanh@example.com
        phone:
          type: string
          example: '+84901234567'
    OwnerApplicationView:
      type: object
      required:
        - application
        - contact
      properties:
        application:
          $ref: '#/components/schemas/ManagerApplication'
        contact:
          $ref: '#/components/schemas/ApplicantContact'
    AppointManagerRequest:
      type: object
      additionalProperties: false
      description: Chọn hồ sơ ứng tuyển thuộc chính Venue này; không bổ nhiệm bằng một userId tùy ý.
      required:
        - applicationId
      properties:
        applicationId:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
    ManagerAppointment:
      type: object
      required:
        - id
        - venueId
        - userId
        - appointedAt
      properties:
        id:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        venueId:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        userId:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        appointedAt:
          type: string
          format: date-time
          example: '2026-10-20T18:00:00+07:00'
    OwnerManagerView:
      type: object
      description: Chỉ Owner đúng Venue được xem profile Manager đã bổ nhiệm.
      required:
        - appointment
        - profile
      properties:
        appointment:
          $ref: '#/components/schemas/ManagerAppointment'
        profile:
          $ref: '#/components/schemas/AccountProfile'
    Feedback:
      type: object
      description: Nội dung góp ý công khai, không kèm profile hoặc thông tin liên hệ tác giả.
      required:
        - id
        - venueId
        - content
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        venueId:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
        content:
          type: string
          example: Sân sạch, dễ tìm đường.
        createdAt:
          type: string
          format: date-time
          example: '2026-10-20T18:00:00+07:00'
    CreateFeedbackRequest:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          example: Sân sạch, dễ tìm đường.
    UpdateAccountStatusRequest:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ACTIVE
            - LOCKED
          description: ACTIVE để mở khóa, LOCKED để khóa. Không dùng để khôi phục tài khoản đã xóa.
    CancelCustomerBookingRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Lý do hủy gửi cho người đặt; không chấp nhận chuỗi chỉ có khoảng trắng.
          example: Sân cần sửa hệ thống chiếu sáng.
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ hoặc điều kiện nghiệp vụ chưa thỏa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Dữ liệu gửi lên không hợp lệ.
    Unauthorized:
      description: Chưa đăng nhập, token hết hạn hoặc không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Cần đăng nhập hoặc đăng nhập lại.
    Forbidden:
      description: Đã xác thực nhưng sai vai trò hoặc tài khoản bị khóa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Tài khoản không có vai trò được phép hoặc đã bị khóa.
    NotFound:
      description: Tài nguyên không tồn tại, đã xóa hoặc nằm ngoài phạm vi dữ liệu được phép truy cập.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Không tìm thấy tài nguyên trong phạm vi được phép truy cập.
    Conflict:
      description: Xung đột dữ liệu hoặc trạng thái hiện tại.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CONFLICT
            message: Thao tác xung đột với trạng thái hiện tại.
