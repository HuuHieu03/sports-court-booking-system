openapi: 3.0.3
info:
  title: Football Booking MVP API
  version: 0.2.0
  description: Ứng dụng giúp người dùng tìm và đặt sân bóng đá, đồng thời hỗ trợ chủ sân và quản lý vận hành cụm
    sân, theo dõi lịch đặt.
servers:
  - url: http://localhost:3000/api/v1
    description: Backend local dự kiến, chưa triển khai
tags:
  - name: Tài khoản
    description: Đăng ký, đăng nhập và xem tài khoản của chính mình.
  - name: Công khai
    description: Tra cứu Venue, Court, sân trống và feedback. Không cần đăng nhập.
  - name: User
    description: 'Mọi tài khoản đang hoạt động đều có quyền User, bao gồm Owner và Manager: đặt/hủy booking cá nhân,
      gửi feedback và ứng tuyển.'
  - name: Owner
    description: Tạo Venue, quản lý các Venue thuộc sở hữu và tuyển/bổ nhiệm/thu hồi Manager. Manager không được
      gọi các API trong nhóm này.
  - name: Owner và Manager
    description: Owner sở hữu Venue hoặc Manager được bổ nhiệm tại Venue đó. Được quản lý sân, xem hồ sơ khách và
      hủy booking của khách kèm lý do, thông báo.
  - name: Admin
    description: 'Chỉ Admin: xem, khóa, mở khóa và xóa tài khoản. Quyền Admin không mặc định cấp quyền Owner hoặc
      Manager.'
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
        - Tài khoản
      summary: Đăng ký tài khoản
      description: |-
        **Ai được gọi:** Bất kỳ ai; không cần đăng nhập.

        **Phạm vi:** Tài khoản mới của người đăng ký.

        Chọn USER hoặc OWNER khi đăng ký. Cung cấp tên, email, số điện thoại và mật khẩu. Thành công trả thông tin tài khoản và access token; email hoặc số điện thoại đã được dùng trả 409.
      operationId: postAuthRegister
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/login:
    post:
      tags:
        - Tài khoản
      summary: Đăng nhập
      description: |-
        **Ai được gọi:** Bất kỳ ai; không cần đăng nhập.

        **Phạm vi:** Tài khoản khớp email và mật khẩu.

        Thành công trả access token. Thông tin sai, tài khoản bị khóa hoặc đã xóa trả 401 với thông báo chung.
      operationId: postAuthLogin
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /me:
    get:
      tags:
        - Tài khoản
      summary: Xem tài khoản của chính mình
      description: |-
        **Ai được gọi:** User, Owner, Manager hoặc Admin đã đăng nhập.

        **Phạm vi:** Chỉ tài khoản gắn với token hiện tại.

        Trả tên, email, số điện thoại, vai trò và danh sách Venue đang được bổ nhiệm quản lý.
      operationId: getMe
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /venues:
    get:
      tags:
        - Công khai
      summary: Tìm và xem các Venue
      description: |-
        **Ai được gọi:** Bất kỳ ai; không cần đăng nhập.

        **Phạm vi:** Tất cả Venue chưa bị xóa.

        Tìm theo tên hoặc địa chỉ bằng q; bỏ q để xem danh sách Venue.
      operationId: getVenues
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Venue'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
      parameters:
        - name: q
          in: query
          required: false
          description: Từ khóa tìm kiếm; bỏ qua để xem tất cả.
          schema:
            type: string
            maxLength: 200
    post:
      tags:
        - Owner
      summary: Tạo Venue
      description: |-
        **Ai được gọi:** Chỉ Owner đã đăng nhập.

        **Phạm vi:** Venue mới thuộc sở hữu người gọi.

        Tạo Venue với tên, địa chỉ và mô tả. Owner được lấy từ token. Thông báo tuyển Manager mặc định đóng.
      operationId: postVenues
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVenueRequest'
  /venues/{venueId}:
    parameters:
      - name: venueId
        in: path
        required: true
        description: ID của tài nguyên.
        schema:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
    get:
      tags:
        - Công khai
      summary: Xem chi tiết Venue
      description: |-
        **Ai được gọi:** Bất kỳ ai; không cần đăng nhập.

        **Phạm vi:** Venue có ID trên đường dẫn, chưa bị xóa.

        Trả thông tin Venue và thông báo tuyển Manager. Không trả profile hoặc liên hệ cá nhân của Owner/Manager.
      operationId: getVenuesVenueid
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
    delete:
      tags:
        - Owner
      summary: Xóa Venue
      description: |-
        **Ai được gọi:** Chỉ Owner sở hữu Venue.

        **Phạm vi:** Venue thuộc sở hữu người gọi và các Court trong Venue đó.

        **Xử lý xóa:** xóa logic Venue và các Court, đóng tuyển và thu hồi bổ nhiệm Manager (hồ sơ APPOINTED chuyển thành REVOKED). Giữ lịch sử booking; Venue/Court đã xóa không còn xuất hiện trong tra cứu hoặc nhận booking mới. Chặn xóa nếu bất kỳ Court nào còn booking CONFIRMED có endsAt sau thời điểm hiện tại. Các thay đổi phải hoàn tất cùng nhau.
      operationId: deleteVenue
      responses:
        '204':
          description: Thành công, không có response body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Venue còn booking đang diễn ra hoặc sắp tới.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: VENUE_HAS_ACTIVE_BOOKINGS
                message: Chưa thể xóa Venue vì còn booking chưa kết thúc.
    patch:
      tags:
        - Owner và Manager
      summary: Cập nhật Venue
      description: |-
        **Ai được gọi:** Owner sở hữu Venue hoặc Manager đang được bổ nhiệm tại Venue đó.

        **Phạm vi:** Venue người gọi sở hữu hoặc đang được bổ nhiệm quản lý.

        Cập nhật tên, địa chỉ hoặc mô tả. Không chuyển quyền sở hữu hoặc thay đổi quyền Manager.
      operationId: patchVenuesVenueid
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVenueRequest'
  /venues/{venueId}/courts:
    parameters:
      - name: venueId
        in: path
        required: true
        description: ID của tài nguyên.
        schema:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
    get:
      tags:
        - Công khai
      summary: Xem các Court của Venue
      description: |-
        **Ai được gọi:** Bất kỳ ai; không cần đăng nhập.

        **Phạm vi:** Các Court chưa bị xóa thuộc Venue trên đường dẫn.

        Trả danh sách sân của Venue; danh sách rỗng nếu chưa có sân.
      operationId: getVenuesVenueidCourts
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Court'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
    post:
      tags:
        - Owner và Manager
      summary: Thêm Court vào Venue
      description: |-
        **Ai được gọi:** Owner sở hữu Venue hoặc Manager đang được bổ nhiệm tại Venue đó.

        **Phạm vi:** Court mới trong Venue người gọi được quản lý.

        Tạo sân với tên và mô tả. venueId được lấy từ đường dẫn.
      operationId: postVenuesVenueidCourts
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Court'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourtRequest'
  /courts/{courtId}:
    parameters:
      - name: courtId
        in: path
        required: true
        description: ID của tài nguyên.
        schema:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
    get:
      tags:
        - Công khai
      summary: Xem chi tiết Court
      description: |-
        **Ai được gọi:** Bất kỳ ai; không cần đăng nhập.

        **Phạm vi:** Court có ID trên đường dẫn, chưa bị xóa.

        Trả thông tin sân và venueId.
      operationId: getCourtsCourtid
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Court'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
    patch:
      tags:
        - Owner và Manager
      summary: Cập nhật Court
      description: |-
        **Ai được gọi:** Owner sở hữu Venue hoặc Manager đang được bổ nhiệm tại Venue đó.

        **Phạm vi:** Court thuộc Venue người gọi được quản lý.

        Cập nhật tên hoặc mô tả sân. Không chuyển Court sang Venue khác.
      operationId: patchCourtsCourtid
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Court'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourtRequest'
    delete:
      tags:
        - Owner và Manager
      summary: Xóa Court
      description: |-
        **Ai được gọi:** Owner sở hữu Venue hoặc Manager đang được bổ nhiệm tại Venue đó.

        **Phạm vi:** Court thuộc Venue người gọi được quản lý.

        **Xử lý xóa:** xóa logic Court và giữ lịch sử booking. Court đã xóa không còn xuất hiện trong tra cứu và không nhận booking mới. Chặn xóa nếu sân còn booking CONFIRMED có endsAt sau thời điểm hiện tại. Không tự hủy booking của khách.
      operationId: deleteCourt
      responses:
        '204':
          description: Thành công, không có response body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Court còn booking đang diễn ra hoặc sắp tới.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: COURT_HAS_ACTIVE_BOOKINGS
                message: Chưa thể xóa Court vì còn booking chưa kết thúc.
  /courts/{courtId}/availability:
    parameters:
      - name: courtId
        in: path
        required: true
        description: ID của tài nguyên.
        schema:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
    get:
      tags:
        - Công khai
      summary: Kiểm tra sân trống trong khung giờ
      description: |-
        **Ai được gọi:** Bất kỳ ai; không cần đăng nhập.

        **Phạm vi:** Một Court và khung giờ startsAt–endsAt.

        startsAt phải ở tương lai, endsAt sau startsAt và cả hai có múi giờ. Trả available=true khi không trùng booking CONFIRMED. Hai booking được phép liền giờ; booking CANCELLED không giữ sân. Kết quả kiểm tra không giữ chỗ và không tiết lộ người đặt khác.
      operationId: getCourtsCourtidAvailability
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      parameters:
        - name: startsAt
          in: query
          required: true
          description: Giờ bắt đầu, bắt buộc có múi giờ.
          schema:
            type: string
            format: date-time
            example: '2026-10-20T18:00:00+07:00'
        - name: endsAt
          in: query
          required: true
          description: Giờ kết thúc, sau startsAt.
          schema:
            type: string
            format: date-time
            example: '2026-10-20T19:00:00+07:00'
  /venues/{venueId}/feedback:
    parameters:
      - name: venueId
        in: path
        required: true
        description: ID của tài nguyên.
        schema:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
    get:
      tags:
        - Công khai
      summary: Xem feedback của Venue
      description: |-
        **Ai được gọi:** Bất kỳ ai; không cần đăng nhập.

        **Phạm vi:** Feedback của Venue trên đường dẫn.

        Trả nội dung feedback, không kèm profile hoặc thông tin liên hệ người gửi.
      operationId: getVenuesVenueidFeedback
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feedback'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
    post:
      tags:
        - User
      summary: Gửi feedback cho Venue
      description: |-
        **Ai được gọi:** Mọi tài khoản đã đăng nhập và đang hoạt động, bao gồm Owner và Manager.

        **Phạm vi:** Feedback cho Venue trên đường dẫn.

        Gửi nội dung văn bản. Tác giả được lấy từ token. Điều kiện bắt buộc đã đặt sân trước khi feedback vẫn cần chốt.
      operationId: postVenuesVenueidFeedback
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedbackRequest'
  /bookings:
    post:
      tags:
        - User
      summary: Đặt sân và xác nhận tự động
      description: |-
        **Ai được gọi:** Mọi tài khoản đã đăng nhập và đang hoạt động, bao gồm Owner và Manager.

        **Phạm vi:** Booking mới của chính người gọi; Court phải còn hoạt động.

        Gửi courtId, startsAt và endsAt. Nếu khung giờ hợp lệ và sân còn trống, tạo booking CONFIRMED ngay. Kiểm tra và đặt sân phải bảo đảm hai request không thể tạo booking trùng nhau.
      operationId: postBookings
      responses:
        '201':
          description: Thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Sân đã được đặt trong khung giờ này.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: BOOKING_CONFLICT
                message: Sân đã có booking trùng khung giờ.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
  /me/bookings:
    get:
      tags:
        - User
      summary: Xem booking của chính mình
      description: |-
        **Ai được gọi:** Mọi tài khoản đã đăng nhập và đang hoạt động, bao gồm Owner và Manager.

        **Phạm vi:** Chỉ booking do người gọi đặt.

        Xem danh sách booking của mình; có thể lọc trạng thái CONFIRMED hoặc CANCELLED.
      operationId: getMeBookings
      responses:
        '200':
          description: Thành công.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - name: status
          in: query
          required: false
          description: Lọc theo trạng thái, bỏ qua để lấy cả hai.
          schema:
            type: string
            enum:
              - CONFIRMED
              - CANCELLED
  /bookings/{bookingId}/cancel:
    parameters:
      - name: bookingId
        in: path
        required: true
        description: ID của tài nguyên.
        schema:
          type: string
          format: uuid
          example: c703f228-62f7-4ee0-b527-652f8152c026
    post:
      tags:
        - User
      summary: Hủy booking của chính mình
      description: |-
        **Ai được gọi:** Mọi tài khoản đã đăng nhập và đang hoạt động, bao gồm Owner và Manager.

        **Phạm vi:** Chỉ booking do người gọi đặt.

        Hủy khi còn ít nhất 30 phút trước giờ bắt đầu, bao gồm đúng mốc 30 phút theo giờ server. Thành công chuyển thành CANCELLED và giải phóng khung giờ. Nếu đã hủy, trả lại booking hiện tại. Owner/Manager hủy booking của khách qua API hủy trong Venue quản lý, bắt buộc có lý do và thông báo.
