services:
  # ============================================================================
  # 1. DATABASE SERVICE (PostgreSQL 17)
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD, đặt file .env ở thư mục gốc}
      POSTGRES_DB: ${POSTGRES_DB:-football_booking}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Mặc định bind vào 127.0.0.1 để bảo mật CSDL, chỉ máy hiện tại kết nối được
      - "${DB_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 2. DATABASE INITIALIZER & SEEDER
  # Tự động deploy migrations và nạp dữ liệu mẫu rồi thoát (Exited 0)
  # ============================================================================
  db-init:
    build:
      context: .
      dockerfile: docker/db-init.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-football}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-football_booking}?schema=public&options=-c%20TimeZone%3DUTC
      SEED_PASSWORD: ${SEED_PASSWORD:-Secret123@}
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ============================================================================
  # 3. BACKEND API SERVICE (NestJS Modular Monolith)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-football}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-football_booking}?schema=public&options=-c%20TimeZone%3DUTC
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-fbs_jwt_secret_dev_key_2026}
    ports:
      # Cấu hình BIND_IP để quyết định: chỉ localhost (127.0.0.1) hay bất kỳ ai (0.0.0.0)
      - "${BE_BIND_IP:-0.0.0.0}:${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ============================================================================
  # 4. FRONTEND WEB SERVICE (React Vite SPA + NGINX Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      # Cổng web chính để truy cập ứng dụng
      - "${FE_BIND_IP:-0.0.0.0}:${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
