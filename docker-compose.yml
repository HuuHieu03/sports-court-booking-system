services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD, đặt file .env ở thư mục gốc}
      POSTGRES_DB: ${POSTGRES_DB:-football_booking}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Chạy migrate deploy và seed mỗi lần `docker compose up`, xong thì thoát.
  # Cả hai bước đều chạy lại được: migration đã áp dụng sẽ bỏ qua, seed dùng upsert.
  db-init:
    build:
      context: .
      dockerfile: docker/db-init.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-football}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-football_booking}?schema=public&options=-c%20TimeZone%3DUTC
      # Lấy từ .env; thiếu thì seed dừng và báo lỗi.
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      # Tag latest của gói prisma đang là bản RC 8.x; ẩn lời nhắc nâng cấp để tránh cập nhật nhầm.
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
